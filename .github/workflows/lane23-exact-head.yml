name: Lane23 exact publication qualification
on:
  push:
    branches: [evidence/lane23-exact-head-verification]
permissions:
  contents: read
jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - pr: 17
            sha: 324835ce37c04c9d69a145a6cc07013885e05c0f
          - pr: 18
            sha: bd8eaca6b22f0adaaaef30a412e385122825a97c
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.sha }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
          rustflags: ""
      - name: Record exact execution identity
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git log -1 --format=fuller
          rustc -Vv
          cargo -V
          uname -a
          sha256sum Cargo.lock
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Owning regression
        env:
          PR_NUMBER: ${{ matrix.pr }}
        run: |
          if [ "$PR_NUMBER" = 17 ]; then
            cargo test -p okv-eval --bin okv-eval count_conversion_tests --locked -- --nocapture
          else
            cargo test -p okv-object --locked range_read_client::tests:: -- --nocapture
          fi
      - run: cargo test --workspace --locked
      - run: cargo run -p okv-eval --locked -- smoke
      - run: cargo run -p okv-eval --locked -- validate-suite evals/suites/smoke.toml
      - name: Record unchanged source
        run: |
          git diff --exit-code
          git rev-parse HEAD
          sha256sum Cargo.lock
